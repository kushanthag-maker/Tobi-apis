<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus API</title>
<style>
:root{--bg:#0e1116;--panel:#171b22;--line:#2a303a;--text:#e6e9ef;--mute:#8b93a1;--accent:#5eead4;--ok:#86efac;--err:#fca5a5}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#dde1e7;--text:#14181f;--mute:#5d6673;--accent:#0f766e;--ok:#15803d;--err:#b91c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:1rem;color:var(--mute);margin:28px 0 8px;font-weight:600}
.ep{border:1px solid var(--line);background:var(--panel);border-radius:8px;margin-bottom:8px;overflow:hidden}
.head{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.head code{color:var(--accent);word-break:break-all}
.head span{color:var(--mute);font-size:.9rem;margin-left:auto;text-align:right}
.body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.ep.open .body{display:block}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row label{flex:1 1 140px;font-size:.8rem;color:var(--mute)}
.row input{margin-top:2px;padding:8px 10px}
button.run{margin-top:12px;padding:9px 16px;border:0;border-radius:8px;background:var(--accent);color:#04211d;font:inherit;font-weight:600;cursor:pointer}
.url{margin-top:12px;font-size:.85rem;color:var(--mute);word-break:break-all}
pre{margin:10px 0 0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:340px;font-size:.82rem;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<main>
  <h1>Nexus API</h1>
  <p class="sub" id="sub">Free REST APIs. No login, no key.</p>
  <input id="search" type="search" placeholder="Search endpoints" aria-label="Search endpoints">
  <div id="list"></div>
</main>
<script>
const list = document.getElementById('list');
let all = [];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(filter=''){
  const f = filter.toLowerCase();
  const groups = {};
  all.filter(e => (e.path+e.description+e.category).toLowerCase().includes(f))
     .forEach(e => (groups[e.category] ||= []).push(e));
  list.innerHTML = Object.entries(groups).map(([cat, eps]) =>
    `<h2>${esc(cat)}</h2>` + eps.map(e => {
      const params = Object.entries(e.params||{});
      return `<div class="ep" data-path="${esc(e.path)}">
        <button class="head" aria-expanded="false"><code>${esc(e.path)}</code><span>${esc(e.description)}</span></button>
        <div class="body">
          ${params.length ? `<div class="row">${params.map(([k,v])=>`<label>${esc(k)}<input data-k="${esc(k)}" value="${esc(v)}"></label>`).join('')}</div>` : ''}
          <button class="run">Send request</button>
          <div class="url"></div>
          <pre hidden></pre>
        </div></div>`;
    }).join('')
  ).join('') || '<p class="sub">No endpoints match.</p>';
}

list.addEventListener('click', async ev => {
  const ep = ev.target.closest('.ep'); if(!ep) return;
  if (ev.target.closest('.head')) {
    const open = ep.classList.toggle('open');
    ep.querySelector('.head').setAttribute('aria-expanded', open);
    return;
  }
  if (ev.target.classList.contains('run')) {
    const p = new URLSearchParams();
    ep.querySelectorAll('input[data-k]').forEach(i => { if(i.value) p.set(i.dataset.k, i.value); });
    const url = location.origin + ep.dataset.path + (p.toString() ? '?' + p : '');
    ep.querySelector('.url').textContent = url;
    const pre = ep.querySelector('pre'); pre.hidden = false; pre.textContent = 'Loading...';
    try {
      const r = await fetch(url);
      const ct = r.headers.get('content-type') || '';
      if (ct.startsWith('image/')) { pre.innerHTML = `<img src="${esc(url)}" alt="result" style="max-width:100%">`; return; }
      pre.textContent = JSON.stringify(await r.json(), null, 2);
    } catch (e) { pre.textContent = 'Request failed: ' + e.message; }
  }
});

document.getElementById('search').addEventListener('input', e => render(e.target.value));

fetch('/api').then(r => r.json()).then(d => {
  all = d.endpoints;
  document.getElementById('sub').textContent = `${d.total} free endpoints. No login, no key.`;
  render();
}).catch(() => { list.innerHTML = '<p class="sub">Could not load endpoints. Check that /api is deployed.</p>'; });
</script>
</body>
</html>
